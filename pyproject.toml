[project]
name = "gantrel-printer"
version = "0.1.0"
description = "Gantrel printer and camera CLI: one safe interface to Klipper, OctoPrint, PrusaLink, Bambu Lab LAN and Creality printers"
readme = "docs/PRINTERS.md"
license = "MIT"
requires-python = ">=3.11"
# Licenses (docs/STACK.md rule: link only MIT, Apache, BSD, LGPL):
#   HTTP is the Python standard library (no certifi, which is MPL-2.0). websockets BSD-3-Clause, paho-mqtt EPL-2.0 OR EDL-1.0 (used under EDL-1.0,
#   which is BSD-3-Clause), zeroconf LGPL-2.1, keyring MIT, numpy BSD-3-Clause (the print planner's mesh math),
#   mcp MIT (the official MCP Python SDK, for gantrel-mcp; its own dependencies are MIT, BSD, Apache-2.0,
#   MIT-0 and PSF-2.0 for typing-extensions, checked 2026-11-23).
dependencies = [
    "websockets>=13",
    "paho-mqtt>=2.1",
    "zeroconf>=0.132",
    "keyring>=25",
    "pyserial>=3.5",
    "numpy>=2",
    "mcp>=2.3,<3",
]

[project.scripts]
gantrel-printer = "gantrel_printer.cli:main"
gantrel-studio = "gantrel_studio.cli:main"
gantrel-mcp = "gantrel_mcp.server:main"
gantrel-solid = "gantrel_solid.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gantrel_printer", "src/gantrel_studio", "src/gantrel_mcp", "src/gantrel_solid"]

[tool.pytest.ini_options]
testpaths = ["tests/printers", "tests/skills/printers", "tests/skills/parametric-cad-dfm", "tests/skills/dfm-accommodation", "tests/skills/mechanical-tolerance-dfm", "tests/skills/pcb-kicad-dfm", "tests/skills/architecture-home-design", "tests/studio", "tests/plan", "tests/mcp", "tests/packs", "tests/solid"]
